version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelscope-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./sentinelscope.db
      - AI_PROVIDER=mock
      - DEMO_MODE=true
    volumes:
      - ./sentinelscope.db:/app/sentinelscope.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3

